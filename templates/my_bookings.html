<!DOCTYPE html>
<html>

<head>

    <title>My Bookings</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;

            color: #222;
        }

        .container {
            max-width: 700px;

            margin: auto;

            background: white;

            border-radius: 16px;

            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .booking-card {
            margin-top: 15px;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 12px;
        }

        .booking-date {
            font-weight: bold;

            font-size: 18px;
        }

        .booking-time {
            margin-top: 5px;

            color: #555;
        }

        .back-button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .cancel-booking-button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #dc3545;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>My Bookings</h1>


        {% if bookings %}

        {% for booking in bookings %}

        <div class="booking-card">

            <div class="booking-date">

                {{
                booking.booking_date.strftime(
                "%d/%m/%Y"
                )
                }}

            </div>

            <div class="booking-time">

                {{
                booking.start_time.strftime(
                "%H:%M"
                )
                }}

                -

                {{
                booking.end_time.strftime(
                "%H:%M"
                )
                }}

            </div>
            <form method="post" action="/cancel-booking" onsubmit="return confirm('Cancel this booking?');">

                <input type="hidden" name="booking_id" value="{{ booking['id'] }}">

                <input class="cancel-init-data" type="hidden" name="telegram_init_data">

                <button type="submit" class="cancel-booking-button">
                    Cancel Booking
                </button>

            </form>

        </div>

        {% endfor %}

        {% else %}

        <p>
            You currently have no active bookings.
        </p>

        {% endif %}


        <button class="back-button" onclick="window.location.href='/'">
            Back to Schedule
        </button>

    </div>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <script>

        const tg =
            window.Telegram?.WebApp;

        if (tg) {

            tg.ready();
            tg.expand();

            const initData =
                tg.initData || "";

            document
                .querySelectorAll(
                    ".cancel-init-data"
                )
                .forEach(
                    function (input) {
                        input.value = initData;
                    }
                );
        }

    </script>

</body>

</html>
