<!DOCTYPE html>
<html>

<head>

    <title>My Bookings</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/static/css/styles.css?v=20260828-2">

</head>


<body>

    <div class="container">

        <h1>My Bookings</h1>


        {% if bookings %}

        {% for booking in bookings %}

        <div class="booking-card">

            <div class="booking-date">

                {{
                booking.booking_date.strftime(
                "%d/%m/%Y"
                )
                }}

            </div>

            <div class="booking-time">

                {{
                booking.start_time.strftime(
                "%H:%M"
                )
                }}

                -

                {{
                booking.end_time.strftime(
                "%H:%M"
                )
                }}

            </div>
            <form method="post" action="/cancel-booking" onsubmit="return confirm('Cancel this booking?');">

                <input type="hidden" name="booking_id" value="{{ booking['id'] }}">

                <input class="cancel-init-data" type="hidden" name="telegram_init_data">

                <button type="submit" class="cancel-booking-button">
                    Cancel Booking
                </button>

            </form>

        </div>

        {% endfor %}

        {% else %}

        <p>
            You currently have no active bookings.
        </p>

        {% endif %}


        <button class="back-button" onclick="window.location.href='/'">
            Back to Schedule
        </button>

    </div>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <script>

        const tg =
            window.Telegram?.WebApp;

        if (tg) {

            tg.ready();
            tg.expand();

            const initData =
                tg.initData || "";

            document
                .querySelectorAll(
                    ".cancel-init-data"
                )
                .forEach(
                    function (input) {
                        input.value = initData;
                    }
                );
        }

    </script>

</body>

</html>
