<section class="hero-card shared-user-header" aria-labelledby="sharedAppTitle">
    <div class="hero-decoration hero-decoration-one"></div>
    <div class="hero-decoration hero-decoration-two"></div>
    <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3v3m10-3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm3 11c.7-1.5 1.7-2.2 3-2.2s2.3.7 3 2.2m-1-5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/></svg>
    </div>
    <div class="hero-copy">
        <h1 id="sharedAppTitle">B03 Meeting Room</h1>
        <p>Book the room and see when it is available.</p>
    </div>
    {% set user_room = get_user_room_status() %}
    <div class="user-room-status {{ user_room.type }}" role="status" aria-label="Room status: {{ user_room.label }}">
        <span class="user-room-status-dot" aria-hidden="true"></span>
        <div><small>Room Status</small><strong>{{ user_room.label }}</strong><span>{{ user_room.detail }}</span></div>
    </div>
</section>
